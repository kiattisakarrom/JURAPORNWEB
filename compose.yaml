name: jurapornweb

services:
  backend:
    build:
      context: ./backend
    env_file:
      - path: ./.env.docker
        # Preserve literal $ and # in passwords. Requires Compose >= 2.30.
        format: raw
    environment:
      NODE_ENV: production
      PORT: "3001"
      HOSPITAL_CALLBACK_TEST_ENABLED: "false"
    expose:
      - "3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    healthcheck:
      # Startup completes only after the database connection succeeds.
      # TCP readiness avoids reading patient records or creating a snapshot.
      test: ["CMD", "node", "-e", "const s=require('node:net').connect(3001,'127.0.0.1');s.setTimeout(3000);s.on('connect',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1));s.on('timeout',()=>{s.destroy();process.exit(1)})"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  frontend:
    build:
      context: ./frontend
    ports:
      # Use a private LAN IP explicitly to make it accessible to workstations.
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    init: true
